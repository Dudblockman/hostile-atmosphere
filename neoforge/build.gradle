plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

configurations {
    localRuntime
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
        gameTestServer {
            server()
            systemProperty 'neoforge.enableGameTest', 'true'
            systemProperty 'neoforge.gameTestServer', 'true'
            programArguments.addAll '--nogui'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Predicates under data/hostileatmosphere/predicates/ are test-only fixtures loaded from
// the dev classpath during game tests. They must not be shipped in the release jar.
tasks.named('jar', Jar) {
    exclude 'data/hostileatmosphere/predicates/**'
}

// Each game-test class needs its own <classname>.empty_platform.nbt structure file.
// NeoForge's StructureTemplateManager.loadFromResource uses FileToIdConverter("structure", ".nbt"),
// so data-pack structures live in data/<ns>/structure/ (singular), not structures/ (plural).
tasks.register('generateTestStructures') {
    def structDir = file('src/main/resources/data/hostileatmosphere/structure')
    def testClasses = [
        'zonelookuptests', 'modifiercomputationtests',
        'toxinamplifiertests', 'modifierprogressiontests',
        'predicatesourcetests', 'entityhazardtests'
    ]
    outputs.files(testClasses.collect { new File(structDir, "${it}.empty_platform.nbt") })
    doLast {
        structDir.mkdirs()
        testClasses.each { cls ->
            new File(structDir, "${cls}.empty_platform.nbt").bytes = minimalPlatformNbt()
        }
    }
}

tasks.register('syncLocalRuntimeMods', Sync) {
    from configurations.localRuntime
    into layout.projectDirectory.dir('run/mods')
}

tasks.named('processResources').configure {
    dependsOn 'generateTestStructures'
}

tasks.matching { it.name.startsWith('run') }.configureEach {
    dependsOn 'syncLocalRuntimeMods'
}
tasks.named('neoForgeIdeSync').configure {
    dependsOn 'syncLocalRuntimeMods'
}

repositories {
    maven {
        name = 'CreateMod'
        url = 'https://maven.createmod.net'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'RyanHCode'
                url = 'https://maven.ryanhcode.dev/releases'
            }
        }
        filter {
            includeGroupAndSubgroups('dev.ryanhcode')    // Sable, Offroad
            includeGroupAndSubgroups('dev.eriksonn')     // Aeronautics
            includeGroup('dev.simulated_team.simulated') // Simulated
        }
    }
}

// ------------------------------------------------------------------------------------------
// NBT helpers for generateTestStructures
// ------------------------------------------------------------------------------------------

byte[] minimalPlatformNbt() {
    def baos = new java.io.ByteArrayOutputStream()
    def gzip = new java.util.zip.GZIPOutputStream(baos)
    def dos  = new java.io.DataOutputStream(gzip)

    dos.writeByte(10); dos.writeShort(0)  // root TAG_Compound (unnamed)

    // DataVersion: tells DFU no upgrade is needed, avoiding old-format block-id fixers
    dos.writeByte(3); nbtStr(dos, 'DataVersion'); dos.writeInt(3955)

    // size: TAG_List of TAG_Int = [3, 1, 3]
    dos.writeByte(9); nbtStr(dos, 'size'); dos.writeByte(3); dos.writeInt(3)
    dos.writeInt(3); dos.writeInt(1); dos.writeInt(3)

    // palette: TAG_List of TAG_Compound — one entry: {Name:"minecraft:stone"}
    dos.writeByte(9); nbtStr(dos, 'palette'); dos.writeByte(10); dos.writeInt(1)
    dos.writeByte(8); nbtStr(dos, 'Name'); nbtStr(dos, 'minecraft:stone')
    dos.writeByte(0)  // end palette entry

    // blocks: TAG_List of TAG_Compound — 9 blocks for 3×1×3
    dos.writeByte(9); nbtStr(dos, 'blocks'); dos.writeByte(10); dos.writeInt(9)
    [[0,0,0],[1,0,0],[2,0,0],[0,0,1],[1,0,1],[2,0,1],[0,0,2],[1,0,2],[2,0,2]].each { p ->
        dos.writeByte(3);  nbtStr(dos, 'state'); dos.writeInt(0)       // state: Int = 0
        dos.writeByte(11); nbtStr(dos, 'pos'); dos.writeInt(3)         // pos: Int[]
        dos.writeInt(p[0]); dos.writeInt(p[1]); dos.writeInt(p[2])
        dos.writeByte(0)  // end block compound
    }

    // entities: empty TAG_List
    dos.writeByte(9); nbtStr(dos, 'entities'); dos.writeByte(0); dos.writeInt(0)

    dos.writeByte(0)  // end root compound
    dos.flush(); gzip.finish(); gzip.close()
    baos.toByteArray()
}

void nbtStr(java.io.DataOutputStream dos, String s) {
    def b = s.getBytes('UTF-8')
    dos.writeShort(b.length); dos.write(b)
}

