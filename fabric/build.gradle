plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

// Expose common sources to the IDE. The multiloader-loader plugin already adds them
// to compileJava at build time; this declaration is only for IDE classpath resolution.
// Guarded so it doesn't cause double-compilation during a real Gradle build.
if (!gradle.startParameter.taskNames.any { it.contains('compile') || it.contains('build') || it.contains('jar') }) {
    sourceSets.main.java.srcDirs project(':common').sourceSets.main.java.srcDirs
    sourceSets.main.resources.srcDirs project(':common').sourceSets.main.resources.srcDirs
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}